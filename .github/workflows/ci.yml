name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.32

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --extra source-db --extra dev

      - name: Lint Python
        run: uv run --frozen --extra source-db --extra dev ruff check src scripts tests

      - name: Validate Markdown
        run: uv run --frozen --extra source-db --extra dev python scripts/check_markdown.py

      - name: Check imports
        run: uv run --frozen --extra source-db --extra dev python -m compileall -q src scripts tests

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Run tests
        run: uv run --frozen --extra source-db --extra dev pytest -q
